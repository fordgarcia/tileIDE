[workspace]
members = ["crates/core", "crates/config", "crates/lsp", "crates/extensions", "crates/notebook", "crates/dap"]

[workspace.package]
version = "0.5.0-alpha.3"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[package]
name = "tileide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A tiling, riceable code editor for Hyprland"
repository = "https://github.com/fordgarcia/tileIDE"
readme = "README.md"
publish = false

[dependencies]
tileide-core = { path = "crates/core" }
tileide-config = { path = "crates/config" }
tileide-lsp = { path = "crates/lsp" }
tileide-extensions = { path = "crates/extensions" }
tileide-notebook = { path = "crates/notebook" }
tileide-dap = { path = "crates/dap" }
libc = "0.2"
serde_json = "1"
gtk4 = { version = "0.11.5", features = ["v4_12"] }
sourceview5 = "0.11.2"
vte4 = "0.10.0"
pangocairo = "0.22.9"
# Same version gtk4 uses; only adds PNG export for the offscreen `render` command.
cairo-rs = { version = "0.22.9", features = ["png"] }

[profile.release]
strip = true
