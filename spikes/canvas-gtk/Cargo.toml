[package]
name = "tileide-canvas-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "v0.0 spike 1 (R1): transparent TileIDE canvas on Hyprland with GTK4. Throwaway; deleted after Gate 1."

[dependencies]
gtk4 = { version = "0.11.5", features = ["v4_12"] }
gtk4-layer-shell = "0.8.1"
sourceview5 = "0.11.2"
vte4 = "0.10.0"
# Same version gtk4 uses; only adds PNG export for the offscreen `render` command.
cairo-rs = { version = "0.22.9", features = ["png"] }

[profile.release]
strip = true
